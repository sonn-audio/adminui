# Attaches a built bundle to every published release, plus the manifest that says which
# server it needs.
#
# `version.json` goes up as an asset of its own as well as inside the tarball. The server
# reads it *before* downloading anything, to work out which release of this repo an install
# on an older core should be offered — reaching that answer by downloading each candidate
# bundle would cost megabytes per guess.
name: Release Admin UI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A release without a stated minimum installs onto anything, which is the right
      # default for the bundles published before minimums existed and the wrong one for
      # everything after. Cheaper to refuse the release than to chase the console that
      # quietly 404s on somebody's server.
      - name: Check the declared minimum core
        run: |
          node -e '
            const pkg = require("./package.json");
            const min = pkg.sonn && pkg.sonn.minCore;
            if (typeof min !== "string" || !/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(min.trim())) {
              console.error("package.json needs sonn.minCore set to the oldest server core that can serve this build.");
              console.error("Name the beta the requirement landed in (4.0.0-beta.22), never the stable it is heading for:");
              console.error("a minimum of 4.0.0 is not satisfied by 4.0.0-beta.30, so it locks out the whole beta cycle.");
              process.exit(1);
            }
            console.log("minCore:", min.trim());
          '

      - name: Build
        run: npm run build

      - name: Package dist
        run: tar -C dist -czf admin-dist.tgz .

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            admin-dist.tgz
            dist/version.json
